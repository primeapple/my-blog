---
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    assignees:
      - primeapple
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - primeapple
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-ci)"
